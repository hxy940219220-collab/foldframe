services:
  mongodb:
    ports: !reset []
  redis:
    ports: !reset []
    environment:
      REDISCLI_AUTH: password
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --raw ping)\" = PONG"]
  rustfs:
    ports: !reset []
    environment:
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET:?}
  rustfs-init:
    environment:
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET:?}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        endpoint=http://rustfs.local:9000
        aws --endpoint-url "$$endpoint" s3api head-bucket --bucket aitoearn 2>/dev/null ||
          aws --endpoint-url "$$endpoint" s3 mb s3://aitoearn
        aws --endpoint-url "$$endpoint" s3api put-bucket-policy --bucket aitoearn --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::aitoearn/*"}]}'
  aitoearn-init:
    depends_on:
      mongodb-rs-init:
        condition: service_completed_successfully
  aitoearn-ai:
    image: aitoearn-workspace-ai:local
    pull_policy: build
    build:
      context: ./project/aitoearn-backend
      dockerfile: Dockerfile.studio-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOCAL_BRIDGE_URL: http://host.docker.internal:${LOCAL_BRIDGE_PORT:-18787}
      LOCAL_BRIDGE_TOKEN: ${LOCAL_BRIDGE_TOKEN:-}
      LOCAL_PUBLIC_ORIGIN: http://127.0.0.1:${LOCAL_WEB_PORT:-8080}
      FOLDFRAME_HOST_SKILLS_DIR: ${FOLDFRAME_HOST_SKILLS_DIR:-}
    volumes:
      - ./.local-run/ai.yaml:/app/config.yaml
  aitoearn-server:
    volumes:
      - ./.local-run/server.yaml:/app/config.yaml
  nginx:
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:${LOCAL_WEB_PORT:?}:80"
      - "127.0.0.1:${LOCAL_UPLOAD_PORT:?}:9000"
  aitoearn-web:
    environment:
      SITE_ORIGIN: http://localhost:${LOCAL_WEB_PORT:?}
    volumes:
      - ./project/aitoearn-backend/apps/aitoearn-ai/src/core/agent/skills:/app/agent-skills:ro
    image: aitoearn-workspace-web:local
    pull_policy: build
    build:
      context: ./project/aitoearn-web
